name: Update Mega Sena History

on:
  # Run twice a week (Wed and Sat at 23:00 UTC - after typical draw times)
  schedule:
    - cron: "0 23 * * 3,6"

  # Allow manual trigger
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest draws
        run: npm run fetch-history

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet public/data/megasena-history.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new draws found"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New draws found!"
          fi

      - name: Commit and push changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/megasena-history.json
          git commit -m "chore: update mega sena history [skip ci]"
          git push
